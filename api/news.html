<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Civic Resilience — News Intelligence</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#050f1c;--card:#0c1f35;--card2:#0f2540;--border:#1a3a5c;
  --primary:#00b4d8;--primary-dim:#0077a3;
  --national:#3b82f6;--government:#10b981;--local:#f59e0b;--nonprofit:#8b5cf6;
  --uplift:#fbbf24;--blindspot:#ef4444;
  --text:#e2e8f0;--muted:#64748b;--white:#ffffff;
}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;min-height:100vh;}

/* ── Header ── */
header{background:rgba(12,31,53,0.95);border-bottom:1px solid var(--border);padding:0 24px;position:sticky;top:0;z-index:100;backdrop-filter:blur(8px);}
.header-inner{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:16px;height:56px;}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
.live-dot{width:8px;height:8px;border-radius:50%;background:#ef4444;box-shadow:0 0 8px #ef4444;animation:pulse 2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.logo-text{font-size:15px;font-weight:700;color:var(--primary);letter-spacing:.04em;text-transform:uppercase;}
.header-right{margin-left:auto;display:flex;align-items:center;gap:12px;}
#last-refresh{font-size:12px;color:var(--muted);}
.btn{padding:6px 14px;border-radius:6px;border:none;cursor:pointer;font-size:13px;font-weight:600;transition:.2s;}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text);}
.btn-outline:hover{border-color:var(--primary);color:var(--primary);}
.btn-primary{background:var(--primary);color:#000;}
.btn-primary:hover{background:var(--primary-dim);}
.btn-sm{padding:4px 10px;font-size:12px;}
#key-input{background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:6px;padding:5px 10px;color:var(--text);font-size:12px;width:200px;}
#key-input::placeholder{color:var(--muted);}

/* ── Stats bar ── */
.stats-bar{background:rgba(0,180,216,.07);border-bottom:1px solid var(--border);padding:8px 24px;}
.stats-inner{max-width:1280px;margin:0 auto;display:flex;gap:24px;align-items:center;flex-wrap:wrap;}
.stat{display:flex;align-items:center;gap:6px;font-size:13px;}
.stat-num{font-weight:700;color:var(--primary);}
.stat-label{color:var(--muted);}
.type-pill{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600;}
.type-national{background:rgba(59,130,246,.2);color:#93c5fd;}
.type-government{background:rgba(16,185,129,.2);color:#6ee7b7;}
.type-local{background:rgba(245,158,11,.2);color:#fcd34d;}
.type-nonprofit{background:rgba(139,92,246,.2);color:#c4b5fd;}

/* ── Filters ── */
.filters{padding:12px 24px;border-bottom:1px solid var(--border);}
.filters-inner{max-width:1280px;margin:0 auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.filter-btn{padding:6px 16px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:13px;cursor:pointer;transition:.15s;}
.filter-btn:hover{border-color:var(--primary);color:var(--text);}
.filter-btn.active{background:var(--primary);border-color:var(--primary);color:#000;font-weight:600;}
.filter-count{background:rgba(255,255,255,.15);border-radius:8px;padding:0 6px;font-size:11px;margin-left:4px;}
.push-all-btn{margin-left:auto;}

/* ── Main grid ── */
main{max-width:1280px;margin:0 auto;padding:20px 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px;}

/* ── Story card ── */
.story-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;transition:.2s;position:relative;}
.story-card:hover{border-color:var(--primary-dim);box-shadow:0 0 20px rgba(0,180,216,.1);}
.story-card.uplifted{border-color:var(--uplift);background:rgba(251,191,36,.04);}
.story-card.blindspot{border-left:3px solid var(--blindspot);}

.card-badges{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.badge{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;letter-spacing:.04em;}
.badge-uplifted{background:rgba(251,191,36,.2);color:var(--uplift);border:1px solid rgba(251,191,36,.4);}
.badge-blindspot{background:rgba(239,68,68,.15);color:#fca5a5;}
.badge-multi{background:rgba(0,180,216,.15);color:var(--primary);}
.badge-civic{background:rgba(16,185,129,.15);color:#6ee7b7;}

.card-title{font-size:15px;font-weight:600;line-height:1.4;color:var(--white);}
.card-title a{color:inherit;text-decoration:none;}
.card-title a:hover{color:var(--primary);}

/* Source diversity bar */
.diversity-bar{height:5px;border-radius:3px;display:flex;overflow:hidden;gap:1px;}
.diversity-seg{height:100%;border-radius:2px;min-width:4px;}

.source-pills{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.age{font-size:11px;color:var(--muted);margin-left:auto;}

/* Card actions */
.card-actions{display:flex;gap:8px;align-items:center;margin-top:2px;}
.uplift-btn{display:flex;align-items:center;gap:5px;padding:5px 12px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;transition:.15s;}
.uplift-btn:hover{border-color:var(--uplift);color:var(--uplift);}
.uplift-btn.active{background:rgba(251,191,36,.15);border-color:var(--uplift);color:var(--uplift);}
.ticker-btn{display:flex;align-items:center;gap:5px;padding:5px 12px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;transition:.15s;}
.ticker-btn:hover{border-color:var(--primary);color:var(--primary);}
.ticker-btn.sent{border-color:#10b981;color:#10b981;}

/* ── Empty / loading ── */
#loading{display:flex;align-items:center;justify-content:center;padding:80px;color:var(--muted);font-size:15px;grid-column:1/-1;}
.spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin-right:12px;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── Toast ── */
#toast{position:fixed;bottom:24px;right:24px;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:10px 16px;font-size:13px;color:var(--text);opacity:0;transform:translateY(8px);transition:.3s;pointer-events:none;z-index:999;}
#toast.show{opacity:1;transform:translateY(0);}
#toast.ok{border-color:#10b981;color:#6ee7b7;}
#toast.err{border-color:#ef4444;color:#fca5a5;}

/* ── Uplift note modal ── */
#modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;align-items:center;justify-content:center;}
#modal-overlay.open{display:flex;}
#modal{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:24px;width:400px;max-width:90vw;}
#modal h3{font-size:16px;font-weight:700;color:var(--white);margin-bottom:12px;}
#modal-note{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:6px;padding:8px;color:var(--text);font-size:13px;resize:vertical;min-height:60px;}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a class="logo" href="/news">
      <span class="live-dot"></span>
      <span class="logo-text">Civic Resilience — News Intelligence</span>
    </a>
    <div class="header-right">
      <span id="last-refresh">—</span>
      <input id="key-input" type="password" placeholder="API key (for uplift / push)" autocomplete="off">
      <button class="btn btn-outline btn-sm" onclick="refreshFeed()">↻ Refresh</button>
      <a class="btn btn-outline btn-sm" href="/control" target="_blank">OBS Control</a>
    </div>
  </div>
</header>

<div class="stats-bar">
  <div class="stats-inner" id="stats-bar">
    <span class="stat"><span class="stat-num" id="stat-total">—</span><span class="stat-label">stories</span></span>
    <span class="stat"><span class="stat-num" id="stat-multi">—</span><span class="stat-label">multi-source</span></span>
    <span class="stat"><span class="stat-num" id="stat-blind">—</span><span class="stat-label">blindspots</span></span>
    <span class="stat"><span class="stat-num" id="stat-uplift">—</span><span class="stat-label">uplifted</span></span>
    <span class="stat">
      <span class="type-pill type-local">local</span>
      <span class="type-pill type-government">gov</span>
      <span class="type-pill type-national">national</span>
      <span class="type-pill type-nonprofit">nonprofit</span>
    </span>
  </div>
</div>

<div class="filters">
  <div class="filters-inner">
    <button class="filter-btn active" data-filter="all" onclick="setFilter('all',this)">All <span class="filter-count" id="fc-all">—</span></button>
    <button class="filter-btn" data-filter="local" onclick="setFilter('local',this)">Local <span class="filter-count" id="fc-local">—</span></button>
    <button class="filter-btn" data-filter="government" onclick="setFilter('government',this)">Government <span class="filter-count" id="fc-government">—</span></button>
    <button class="filter-btn" data-filter="national" onclick="setFilter('national',this)">National <span class="filter-count" id="fc-national">—</span></button>
    <button class="filter-btn" data-filter="blindspot" onclick="setFilter('blindspot',this)">Blindspot <span class="filter-count" id="fc-blindspot">—</span></button>
    <button class="filter-btn" data-filter="uplifted" onclick="setFilter('uplifted',this)">⬆ Uplifted <span class="filter-count" id="fc-uplifted">—</span></button>
    <button class="btn btn-primary btn-sm push-all-btn" onclick="pushAllToTicker()">📺 Push to OBS Ticker</button>
  </div>
</div>

<main id="feed">
  <div id="loading"><div class="spinner"></div>Loading news feed…</div>
</main>

<div id="modal-overlay">
  <div id="modal">
    <h3>Uplift this story</h3>
    <p style="font-size:13px;color:var(--muted);margin-bottom:10px;">Add an optional editorial note explaining why this story matters for the community.</p>
    <textarea id="modal-note" placeholder="Why this matters for Civic Resilience…"></textarea>
    <div class="modal-actions">
      <button class="btn btn-outline btn-sm" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary btn-sm" id="modal-confirm">Uplift ⬆</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const BASE = window.location.origin;
let allStories = [];
let currentFilter = 'all';
let pendingUpliftId = null;

const TYPE_COLOR = {
  national: 'var(--national)',
  government: 'var(--government)',
  local: 'var(--local)',
  nonprofit: 'var(--nonprofit)',
};

function apiKey() {
  const k = document.getElementById('key-input').value.trim();
  return k || (localStorage.getItem('cr_api_key') || '');
}

document.getElementById('key-input').addEventListener('change', e => {
  if (e.target.value) localStorage.setItem('cr_api_key', e.target.value);
});

// Pre-fill key from storage
const savedKey = localStorage.getItem('cr_api_key');
if (savedKey) document.getElementById('key-input').value = savedKey;

// ── Fetch and render ─────────────────────────────────────────────────────────
async function loadFeed() {
  try {
    const r = await fetch(`${BASE}/news/feed`);
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    allStories = data.stories || [];
    updateStats(data.stats);
    updateFilterCounts();
    renderFeed();
    const ts = data.stats?.last_refresh;
    if (ts) {
      const mins = Math.round((Date.now() - new Date(ts)) / 60000);
      document.getElementById('last-refresh').textContent =
        mins < 1 ? 'Updated just now' : `Updated ${mins}m ago`;
    }
  } catch(e) {
    document.getElementById('feed').innerHTML =
      '<div id="loading" style="color:#ef4444">Failed to load feed — check API connection</div>';
  }
}

function updateStats(stats) {
  if (!stats) return;
  document.getElementById('stat-total').textContent = stats.total ?? '—';
  document.getElementById('stat-multi').textContent = stats.multi_source ?? '—';
  document.getElementById('stat-blind').textContent = stats.blindspot ?? '—';
  document.getElementById('stat-uplift').textContent = stats.uplifted ?? '—';
}

function updateFilterCounts() {
  document.getElementById('fc-all').textContent = allStories.length;
  document.getElementById('fc-blindspot').textContent = allStories.filter(s => s.is_blindspot).length;
  document.getElementById('fc-uplifted').textContent = allStories.filter(s => s.uplifted).length;
  ['local','government','national'].forEach(t => {
    const el = document.getElementById(`fc-${t}`);
    if (el) el.textContent = allStories.filter(s => s.source_types.includes(t)).length;
  });
}

function filteredStories() {
  if (currentFilter === 'all') return allStories;
  if (currentFilter === 'blindspot') return allStories.filter(s => s.is_blindspot);
  if (currentFilter === 'uplifted') return allStories.filter(s => s.uplifted);
  return allStories.filter(s => s.source_types.includes(currentFilter));
}

function renderFeed() {
  const stories = filteredStories();
  const feed = document.getElementById('feed');
  if (!stories.length) {
    feed.innerHTML = '<div id="loading">No stories in this category yet.</div>';
    return;
  }
  feed.innerHTML = stories.map(storyCard).join('');
}

function diversityBar(typeCount, total) {
  const order = ['local','government','national','nonprofit'];
  return order
    .filter(t => typeCount[t])
    .map(t => {
      const pct = Math.round((typeCount[t] / total) * 100);
      return `<div class="diversity-seg" style="background:${TYPE_COLOR[t]||'#888'};flex:${typeCount[t]};" title="${t}: ${typeCount[t]} source(s)"></div>`;
    }).join('');
}

function storyCard(s) {
  const badges = [];
  if (s.uplifted) badges.push(`<span class="badge badge-uplifted">⬆ UPLIFTED</span>`);
  else if (s.is_blindspot) badges.push(`<span class="badge badge-blindspot">BLINDSPOT</span>`);
  if (s.coverage_count > 1) badges.push(`<span class="badge badge-multi">${s.coverage_count} sources</span>`);
  if (s.civic_score >= 3) badges.push(`<span class="badge badge-civic">CIVIC ★${s.civic_score}</span>`);

  const titleHtml = s.urls?.[0]
    ? `<a href="${s.urls[0]}" target="_blank" rel="noopener">${escHtml(s.title)}</a>`
    : escHtml(s.title);

  const pills = s.source_types.map(t =>
    `<span class="type-pill type-${t}">${t}</span>`
  ).join('');

  const srcNames = s.sources.slice(0,4).map(n => `<span style="font-size:11px;color:var(--muted)">${escHtml(n)}</span>`).join('');
  const more = s.sources.length > 4 ? `<span style="font-size:11px;color:var(--muted)">+${s.sources.length-4} more</span>` : '';

  const bar = diversityBar(s.type_counts || {}, s.coverage_count);
  const age = s.age_minutes < 60
    ? `${s.age_minutes}m ago`
    : `${Math.round(s.age_minutes/60)}h ago`;

  const upliftActive = s.uplifted ? 'active' : '';
  const upliftLabel = s.uplifted ? '⬆ Uplifted' : '⬆ Uplift';

  return `
<div class="story-card${s.uplifted?' uplifted':''}${s.is_blindspot&&!s.uplifted?' blindspot':''}" id="card-${s.id}">
  <div class="card-badges">${badges.join('')}</div>
  <div class="card-title">${titleHtml}</div>
  <div class="diversity-bar">${bar}</div>
  <div class="source-pills">${pills}<span class="age">${age}</span></div>
  <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;">${srcNames}${more}</div>
  <div class="card-actions">
    <button class="uplift-btn ${upliftActive}" onclick="handleUplift('${s.id}',${s.uplifted})">${upliftLabel}</button>
    <button class="ticker-btn" id="ticker-${s.id}" onclick="pushStoryToTicker('${s.id}','${escAttr(s.title)}')">📺 Push to Ticker</button>
  </div>
</div>`;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(s) {
  return s.replace(/'/g,"\\'").replace(/"/g,'&quot;');
}

// ── Filter ───────────────────────────────────────────────────────────────────
function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderFeed();
}

// ── Refresh ───────────────────────────────────────────────────────────────────
async function refreshFeed() {
  const key = apiKey();
  if (key) {
    // Force server-side re-fetch
    try {
      const r = await fetch(`${BASE}/news/refresh`, {
        method: 'POST',
        headers: {'x-api-key': key},
      });
      if (!r.ok) throw new Error(r.status);
      const d = await r.json();
      toast(`Fetched ${d.stories} stories`, 'ok');
    } catch(e) {
      toast('Refresh failed — check API key', 'err');
    }
  }
  await loadFeed();
}

// ── Uplift ────────────────────────────────────────────────────────────────────
function handleUplift(id, currentlyUplifted) {
  if (currentlyUplifted) {
    removeUplift(id);
  } else {
    pendingUpliftId = id;
    document.getElementById('modal-note').value = '';
    document.getElementById('modal-overlay').classList.add('open');
    document.getElementById('modal-confirm').onclick = () => confirmUplift(id);
  }
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  pendingUpliftId = null;
}

document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});

async function confirmUplift(id) {
  const key = apiKey();
  if (!key) { toast('API key required for uplift', 'err'); return; }
  const note = document.getElementById('modal-note').value.trim();
  closeModal();
  try {
    const r = await fetch(`${BASE}/news/uplift/${id}`, {
      method: 'POST',
      headers: {'x-api-key': key, 'Content-Type': 'application/json'},
      body: JSON.stringify({note}),
    });
    if (!r.ok) throw new Error(r.status);
    toast('Story uplifted — pushed to OBS ticker', 'ok');
    // Update local state
    const s = allStories.find(x => x.id === id);
    if (s) { s.uplifted = true; s.uplift_note = note; }
    updateFilterCounts();
    renderFeed();
  } catch(e) {
    toast(`Uplift failed: ${e.message}`, 'err');
  }
}

async function removeUplift(id) {
  const key = apiKey();
  if (!key) { toast('API key required', 'err'); return; }
  try {
    await fetch(`${BASE}/news/uplift/${id}`, {
      method: 'DELETE',
      headers: {'x-api-key': key},
    });
    const s = allStories.find(x => x.id === id);
    if (s) s.uplifted = false;
    toast('Uplift removed', 'ok');
    updateFilterCounts();
    renderFeed();
  } catch(e) {
    toast('Failed to remove uplift', 'err');
  }
}

// ── Ticker ────────────────────────────────────────────────────────────────────
async function pushStoryToTicker(id, title) {
  const key = apiKey();
  if (!key) { toast('API key required', 'err'); return; }
  // Prepend just this headline to the ticker via the overlay endpoint
  try {
    const r = await fetch(`${BASE}/overlay/ticker/prepend`, {
      method: 'POST',
      headers: {'x-api-key': key, 'Content-Type': 'application/json'},
      body: JSON.stringify({headline: title}),
    });
    if (!r.ok) throw new Error(r.status);
    const btn = document.getElementById(`ticker-${id}`);
    if (btn) { btn.textContent = '✓ Sent'; btn.classList.add('sent'); setTimeout(() => { btn.textContent = '📺 Push to Ticker'; btn.classList.remove('sent'); }, 3000); }
    toast('Pushed to OBS ticker', 'ok');
  } catch(e) {
    toast(`Push failed: ${e.message}`, 'err');
  }
}

async function pushAllToTicker() {
  const key = apiKey();
  if (!key) { toast('API key required', 'err'); return; }
  try {
    const r = await fetch(`${BASE}/news/push-ticker`, {
      method: 'POST',
      headers: {'x-api-key': key},
    });
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    toast(`Pushed ${d.pushed} headlines to OBS ticker`, 'ok');
  } catch(e) {
    toast('Push failed', 'err');
  }
}

// ── Toast ─────────────────────────────────────────────────────────────────────
let _toastTimer;
function toast(msg, type='') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `show ${type}`;
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.className = '', 3000);
}

// ── Boot ──────────────────────────────────────────────────────────────────────
loadFeed();
setInterval(loadFeed, 5 * 60 * 1000); // auto-refresh every 5 min
</script>
</body>
</html>
